# GitCurator CI — the same gate the dashboard runs via POST /api/verify.
#
# Every push to main, every tag, and every PR compiles the 24 audited
# Python modules and runs the full 87-case suite (34 unit + 11 e2e + 28
# goodrepos + 14 CLI smoke; the CLI layer's subprocess tests run on bare
# python, the one PyQt6 end-to-end case self-skips without pip).
# The testable core is pure stdlib — no pip install step required.
# PyQt6/telethon/ollama are GUI/runtime deps that the test suite
# deliberately does not touch. (v32.3 modularization: the 9,770-line
# gui/app.py became cli.py + gui/{main_window,workers,log_handler,_qt}.py
# + core/{vault,cache_db,link_tracker,inbox}.py + utils/ +
# integrations/telegram_jobs.py — all joined the compile gate.)

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Python gate (compile + 73 tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile the 24 audited modules
        run: >
          python -m py_compile
          main.py
          gitcurator/cli.py
          gitcurator/gui/app.py
          gitcurator/gui/main_window.py
          gitcurator/gui/workers.py
          gitcurator/gui/log_handler.py
          gitcurator/gui/_qt.py
          gitcurator/core/links.py
          gitcurator/core/storage.py
          gitcurator/core/note_builder.py
          gitcurator/core/llm_client.py
          gitcurator/core/vault.py
          gitcurator/core/cache_db.py
          gitcurator/core/link_tracker.py
          gitcurator/core/inbox.py
          gitcurator/utils/logging_setup.py
          gitcurator/utils/terminal.py
          gitcurator/integrations/vaultseal.py
          gitcurator/integrations/goodrepos.py
          gitcurator/integrations/telegram_jobs.py
          gitcurator/integrations/telegram_fetch_worker.py
          gitcurator/integrations/telethon_fetcher.py
          gitcurator/integrations/backfill_manager.py
          gitcurator/cloud/cloudflare_sync.py

      - name: Run the test suite (34 unit + 11 e2e + 28 goodrepos + 14 CLI)
        run: python -m unittest tests.test_core tests.test_e2e tests.test_goodrepos tests.test_cli -v

      - name: Test summary
        if: always()
        run: echo "Gate mirrors dashboard POST /api/verify — 24 compiles + 87 tests."

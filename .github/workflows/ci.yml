# GitCurator CI — the same gate the dashboard runs via POST /api/verify.
#
# Every push to main, every tag, and every PR compiles the 12 audited
# Python modules and runs the full 73-case suite (34 unit + 11 e2e + 28 goodrepos).
# The testable core is pure stdlib — no pip install step required.
# PyQt6/telethon/ollama are GUI/runtime deps that the test suite
# deliberately does not touch.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Python gate (compile + 73 tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile the 12 audited modules
        run: >
          python -m py_compile
          main.py
          gitcurator/gui/app.py
          gitcurator/core/links.py
          gitcurator/core/storage.py
          gitcurator/core/note_builder.py
          gitcurator/core/llm_client.py
          gitcurator/integrations/vaultseal.py
          gitcurator/integrations/goodrepos.py
          gitcurator/integrations/telegram_fetch_worker.py
          gitcurator/integrations/telethon_fetcher.py
          gitcurator/integrations/backfill_manager.py
          gitcurator/cloud/cloudflare_sync.py

      - name: Run the test suite (34 unit + 11 e2e + 28 goodrepos)
        run: python -m unittest tests.test_core tests.test_e2e tests.test_goodrepos -v

      - name: Test summary
        if: always()
        run: echo "Gate mirrors dashboard POST /api/verify — 12 compiles + 73 tests."

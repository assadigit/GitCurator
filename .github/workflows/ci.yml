# GitCurator CI — the same gate the dashboard runs via POST /api/verify.
#
# Every push to main, every tag, and every PR compiles the 21 audited
# Python modules and runs the full 168-case suite (34 core + 11 e2e +
# 28 goodrepos + 19 reliability + 14 quarantine + 24 phase0 + 38 phase1 —
# v0.10.0 vault settings & ownership: note-state record, ownership
# stamps, vault map, pipeline switches, second VaultSeal).
# test_quarantine, test_phase0 and test_phase1 import gitcurator/gui/app.py
# (CacheDB and ProcessingWorker live there), so the app requirements are
# installed first; the suite runs headless on the offscreen Qt platform
# and never launches the GUI.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Python gate (compile + 130 tests + reliability + quarantine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app requirements (the quarantine suite imports the GUI package)
        run: python -m pip install --quiet -r requirements.txt

      - name: Compile the 21 audited modules
        run: >
          python -m py_compile
          main.py
          gitcurator/gui/app.py
          gitcurator/gui/icons.py
          gitcurator/gui/telegram_lock.py
          gitcurator/core/links.py
          gitcurator/core/storage.py
          gitcurator/core/note_builder.py
          gitcurator/core/llm_client.py
          gitcurator/core/dryrun.py
          gitcurator/core/note_state.py
          gitcurator/integrations/vaultseal.py
          gitcurator/integrations/goodrepos.py
          gitcurator/integrations/telegram_fetch_worker.py
          gitcurator/integrations/telethon_fetcher.py
          gitcurator/integrations/backfill_manager.py
          gitcurator/integrations/subprocess_runner.py
          gitcurator/cloud/cloudflare_sync.py
          gitcurator/cli.py
          gitcurator/tools/scan_vault_edits.py
          gitcurator/tools/snapshot_vault.py
          gitcurator/tools/pick_golden_links.py

      - name: Run the test suite (core + e2e + goodrepos + reliability + quarantine + phase0 + phase1)
        run: python -m unittest tests.test_core tests.test_e2e tests.test_goodrepos tests.test_reliability tests.test_quarantine tests.test_phase0 tests.test_phase1 -v

      - name: Test summary
        if: always()
        run: echo "Gate mirrors dashboard POST /api/verify — 21 compiles + 168 tests (core/e2e/goodrepos/reliability/quarantine/phase0/phase1; v0.10.0)."

# GitCurator CI — the same gate the dashboard runs via POST /api/verify.
#
# Every push to main, every tag, and every PR compiles the 85 audited
# Python modules and runs the full 1396-case suite (34 core + 11 e2e +
# 28 goodrepos + 19 reliability + 14 quarantine + 24 phase0 + 38 phase1 +
# 77 phase2 + 36 phase3 + 45 phase4 + 47 phase5 + 13 packaging + 79
# llamacpp + 45 phase6 + 68 connection + 47 detectset + 48 webproxy +
# 49 intakefix + 38 sealfix + 30 v0230 + 24 refactor_surface + 22
# websitesqueuefix + 11 swotfix + 10 webnote_v2 + 22 lawfix + 29
# importbatch + 27 socialomit + 17 resyncfix + 21 reconfix + 24
# batchfinish + 30 soundsettings + 15 reviewretry + 21 bothdoors +
# 26 decommission + 26 thirddoor + 66 ladder + 23 autopip + 27
# mastertable + 43 handdelivery + 27 reviewtable + 52 fifthdoor +
# 30 masterretry).
# v0.51.0 — THE CAUGHT-UP CHECK READS THE TABLE: the owner's report —
# "Currently app says everything is uptodate, but actually app must
# look at decomissioned note, and try to fetch again those that dont
# have skeleton or red cross or such emojies and have this state
# ' - ' … so before declaring everything is uptodate it must check
# 'decomissioned' note and find those that should be retried" — a
# caught-up SYNC now scans _review/DECOMMISSIONED.md for the " - "
# rows (no verdict emoji, no decision — valid link, failed fetch) and
# auto-starts the master-retry batch: burned-out retry counters are
# reborn ONE row at a time (reset_retry_attempts), each link runs the
# FULL pipeline, the refresh stamps succeeded rows '📁 stored' so the
# table never lies "waiting" about stored links, and the honest
# verdict is said at the end — "everything is up to date" only when no
# " - " fetch row remains. The "eyes" rows (low-confidence /
# analysis / archived notes) are never fetched — they wait for the
# owner's ✅/🪦. More ▸ 🔁 Retry the table's ' - ' rows is the anytime
# trigger. 30 cases join in tests/test_masterretry.py (1396).
# v0.50.0 — THE FIFTH DOOR: the owner's report — "before finishing
# the run and fetch, app must show a modal, 'xx' number of links
# didn't generate content or wasn't successful or got error xxx …
# want to retry them in real browser? if user said this, app
# automatically opens them in a new session of user's own google
# chrome and start tabs and fetches the data that way" — the
# end-of-run modal offers the fetch-failed links, one yes launches
# the owner's own Chrome with a throwaway profile + DevTools, one
# tab per link (in waves), the live DOM is read over a raw-socket
# CDP WebSocket (pure stdlib — masked client frames, fragmentation,
# ping/pong), and each page is delivered into the fourth door's
# hand-delivered folder (queue stamped door 'auto', the story in the
# fetch reason), then re-processed as REAL fetches. The ☠️ law
# (retire AND sweep AND never fetch again) is re-verified against
# the exact gesture — a Status cell with only the emoji. 49 cases
# join in tests/test_fifthdoor.py (1366).
# v0.49.0 — THE TABLE THAT LISTS THEM ALL: the owner's report — "When
# app supposed to add tables so i can set emojies for removed, dead
# etc or to decomission it? it currently only adds links like before
# in _review" — the master table listed the fetch-failed pile and the
# auto-verdict retirements, but the human-eye classes (low
# classification confidence, analysis failures, archived rescues)
# landed as _review notes and never as rows. scan_review_notes makes
# the table the ledger for the WHOLE folder: every app-owned note is
# a row (Status 'unreviewed', the note's reason in Notes), the same
# emoji grammar answers them (🪦/✅ retire AND sweep, ♻️ re-fetches,
# 🖐 hand queues), and the consume sweep takes any app-owned
# placeholder. A hand-written note is never tabled, never swept. 27
# cases join in tests/test_reviewtable.py (1314).
# v0.48.0 — THE FOURTH DOOR: the owner's report — "for some links, the
# fetcher got 403 error, but when I enter them manually on my browser
# they work flawlessly… add another layer (as one of the final
# procedures) of fetching, which app permits me to open in a real
# instance of chrome" — is the strictest bot defenses' one remaining
# tell: none of the ladder's three machine doors is a real Chrome
# driven by the owner's own hand. The fourth door: a walled link
# (refusal family / bot defense / challenge / TLS fingerprint) is
# queued via More ▸ 🖐 Hand-deliver walled links, the master table's
# 🖐 hand Status, or --hand-delivery; the app opens it in the REAL
# Chrome, the owner saves the page (Ctrl+S, HTML Only, the suggested
# filename) into <vault>/_review/hand-delivered/, and the next batch
# consumes it as a REAL full fetch (the story rides in the reason).
# Not a retirement — the link keeps waiting; loopback never opens a
# browser; "web_hand_delivery": false opts out. 37 cases join in
# tests/test_handdelivery.py (1287).
# v0.47.0 — THE DOOR THAT SHIPS ITSELF + THE MASTER TABLE: the
# owner's new pile carried five lines ending "a third door exists:
# pip install curl_cffi" — the door was armed in code but the LIBRARY
# never landed on his machine. Now the first wall that needs the
# Chrome handshake (or a batch's warm-up) installs curl_cffi through
# this interpreter, once per process, offline-safe
# (web_impersonate_autopip opts out); _review/DECOMMISSIONED.md is
# reborn as the REVIEW MASTER TABLE — refreshed after every batch
# with every waiting failure AND every auto-verdict retirement, ✅
# reviewed joins 🪦 dead as a retirement door (the owner's original
# tick gesture), retired links leave the startup notice, and a 52x
# origin-down verdict names the Wayback Machine's last good copy in
# the reason. 23 cases join in tests/test_autopip.py, 27 in
# tests/test_mastertable.py, 7 in tests/test_ladder.py (1244).
# v0.46.0 — THE LADDER: the owner's fresh failure pile (bare "HTTP
# 307", TLS-handshake walls, getaddrinfo failures, 404s, 429s, 523s,
# 402s) maps every failure class to its honest door — the redirect law
# moved into the fetcher's own loop (hop cookies, 308, loop detection,
# honest broken-redirect verdicts), TLS-handshake walls open the third
# door, DNS failures get the DNS-over-HTTPS verdict, dead pages climb
# variants then the Wayback Machine, 429/503 pay Retry-After into the
# domain limiter, and FetchResult.category sends retries only to what
# time can heal (dead/paywalled/refused retire via the graveyard's own
# gate). 59 cases join in tests/test_ladder.py (1187).
# v0.45.0 — THE THIRD DOOR: the owner's "proxy: HTTP 403 | direct:
# HTTP 403 — bot defense (Cloudflare: challenge)" line is the wall
# aimed at the requester's TLS FINGERPRINT — something urllib can
# never present. curl_cffi (now in requirements.txt, optional at
# runtime) re-asks the walled URL with Chrome's own TLS/HTTP2
# handshake, one attempt per allowed route (socks5h when proxied —
# DNS at the proxy), a success there is a real success with the wall
# named, a challenge that survives Chrome gets the three-leg honest
# line plus the "needs a live browser" verdict (the graveyard
# decision, informed). Fires only on refusal-family walls; resource
# truths, connection failures and loopback never ask; the
# web_impersonate_fallback config opts out. 26 cases join in
# tests/test_thirddoor.py (1128).
# v0.44.0 — THE GRAVEYARD: genuinely dead links (real 404s, lost pages,
# abandoned domains) get the decommissioning procedure the owner asked
# for — a markdown ledger at <vault>/_review/DECOMMISSIONED.md where
# setting the Status emoji (🪦 dead — the same gesture as the _inbox
# tables' ✅ reviewed) buries the link for good: dismissed (the
# never-fetch gate), retry-queue row dropped (the delete-then-refetch
# loop, closed), placeholder swept, ♻️ revived brings one back. The
# backlog scan skips buried URLs (no more notices), the startup notice
# grows a third door (🪦 Decommission dead…), More ▸ 🪦 Decommission
# dead links offers the in-app picker. 26 cases join in
# tests/test_decommission.py (1102).
# v0.43.0 — BOTH DOORS: a route-aimed refusal (403 WAF/IP wall, 405
# method-block, 429 per-IP rate limit, 451 geo-block) through the proxy
# now alternates to the DIRECT route exactly like v0.21.0's
# connection-class failures — the wall was aimed at the proxy exit's
# datacenter IP, not at the page; a success via the second door is a
# real success, a wall on both doors reports both reasons. Telegram
# keeps its own law (always the proxy when enabled). 21 cases join in
# tests/test_bothdoors.py (1076).
# v0.41.0 — the UA wall comes down: the fetcher presents as a current
# Chrome (browser-grade header set, REAL gzip/deflate decoding with the
# cap on the decompressed size, custom UA via config "web_user_agent",
# and 403/429 reasons that NAME the visible bot defense — the honest
# bot UA was why working sites 403'd the pipeline); 6 fetch-layer
# cases join test_phase2, 4 UA-wrap cases join test_webproxy (1040).
# v0.40.0 — the Sound settings page (Settings → Sound: the chime's
# switch + 0–100 volume slider + both previews through the exact
# batch gate), the needs-retry voice (a batch that finishes WITH
# failed links plays the softer descending retry.wav — and the
# scorecard heading turns 🏁 warning instead of 🎉 success), and the
# cutover_complete flag RETIRED from the worker (0.30.0: seeded '0'
# at v0.01, never set to '1' by anything, shown as "Pending"
# forever); tests/test_soundsettings.py joins the suite (1030), the
# worker suite gains the two retirement guards (50).
# v0.39.0 — the batch-finish fanfare: a success chime (assets/sounds/
# success.wav through the failure-proof BatchSound wrapper) plus the
# Batch Complete scorecard modal for every batch that runs to natural
# completion (stopped/no-work/crashed batches keep the plain box);
# gitcurator/gui/sound.py joins the compile list, tests/test_batchfinish.py
# joins the suite (1000).
# v0.36.0: the mirror resync — a warned Settings → Backup button (and a
# --resync CLI twin) that makes the GitHub backup repos follow the
# vaults EXACTLY: deletions reach the mirror, a fresh vault against a
# populated mirror reconciles without resurrecting deleted files, and
# main is never force-pushed; tests/test_resyncfix.py joins (945).
# v0.37.0 — the hierarchy pass (short_line + one-line dialog items),
# the frozen-websites-bar fix (on_progress), the worker's batch pastes
# (bare-address extraction + 'N new links received'); worker 0.29.0 (955).
# v0.38.0 — the reconciliation false-positive fix: the vault is the
# ground truth (healing in get_reconciliation_urls / verify /
# get_all_clear, the vault-index dedupe moved BEFORE the GitHub API
# call); tests/test_reconfix.py joins (976).
# v0.35.0: the domain law's second reading — YouTube (the whole group),
# the Google share/drive/docs family and the social-media majors are
# banned outright; banned links are omitted ENTIRELY (never fetched,
# never noted, never collected in the _inbox review-queue tables), the
# tables' legacy banned/stored rows are pruned, the banned platforms'
# tables are quarantined by the law sweep, classify_platform moved to
# core (suffix-anchored), and both pipelines' success logs now show the
# destination ("[Vault Name] Item X processed and stored → path");
# tests/test_socialomit.py joins the suite (928).
# v0.30.0: the external Settings-UI audit, presentation-only — one theme
# kit (gitcurator/gui/theme.py, token tables + a single structural QSS
# + property-driven button variants), the LLM tab as three flat cards,
# real Lucide icons in the Settings sidebar (two-mode selected state),
# emoji purged from the Settings chrome, per-tab header descriptions;
# five presentation-referencing tests updated with intent intact (900).
# v0.29.0: faithful batch imports — a .txt/.md file with one address per
# line now has EVERY address captured (Markdown links, bullets, trailing
# notes, bare domains, http://, www., BOM, duplicates reported, junk
# lines listed), http/www GitHub variants reach the GitHub pipeline
# instead of dying at THE LAW's websites gate, a scheme-less banned
# link can no longer leak past it, and a decorated repo line can no
# longer corrupt the owner/repo parse into a bogus 404;
# tests/test_importbatch.py joins the suite (900).
# v0.24.1: the "websites never sync" queue fix — the bot-queue pending
# classification now covers the WEBSITES vault too (its own VaultIndex +
# WebsiteStateDB dedupe layers), websites-only batches start from
# SYNC/PROCESS, and a caught-up GitHub vault no longer masks unprocessed
# website links; tests/test_websitesqueuefix.py joins the suite (818).
# v0.24.0: the structural split of gitcurator/gui/app.py (13,815 lines)
# into 28 focused modules — gui/{link_helpers,dead_links,telegram_lazy,
# platform_intake,vault_index,cache_db,link_tracker,log_bridge,
# worker_jobs,processing_worker,dialogs,headless}.py plus the
# gui/main_window/ package (window.py + log_view.py + 15 domain mixins). app.py is now
# the ~470-line facade; zero behavior change, verified per-move by the
# fingerprint/surface/import gate and the 24-case characterization suite
# (tests/test_refactor_surface.py joins the run: 796).
# v0.23.0: the five-request desktop overhaul — the Test Connection
# modal, the two-radio LLM tab with first-class Anthropic Claude
# support + the split context budget (llm_num_ctx +
# llm_max_output_tokens), themed dialog backgrounds (the wizard
# light-mode fix), the main view's Detect & Set row removed, and
# Input reduced to Import txt file (.txt/.md); tests/test_v0230.py
# joins the suite (772).
# v0.18.0 Detect & Set: the LLM quick-switch fast lane — 🧠 Detect & Set
# Ollama / 🦙 Detect & Set llama.cpp buttons in Settings → 🧠 LLM (v0.23.0
# moved them off the main screen), the model menu when several models are
# installed, and the CLI twin --detect-llm.
# v0.19.0: the Websites pipeline rides the configured proxy (DNS at the
# proxy exit — the x.com/YouTube connection-refused fix) with a
# per-batch pre-flight, loopback never proxied, and the once-per-proxy-
# epoch retry re-arm.
# v0.20.0: the intake truth — web_blocked_domains (the X fix: never
# fetched/purged/dismissed + the queue bucket), _missing placeholder
# notes for 404 repos (+ backfill; they stop counting as pending), and
# the _inbox platform tables routed to the Websites vault;
# tests/test_intakefix.py joins the suite.
# v0.21.0: the seal truth — VaultSeal push reconciliation (fetch →
# rebase/merge-unrelated → push; irreconcilable → seal-rescue branch,
# main never force-pushed), self domains (the bot's own auth links
# never fetched; tokens scrubbed out of _inbox rows), the verification
# report's full accounting (websites/blocked/pending buckets +
# reconciliation against the total), and the web-fetch direct fallback
# for proxy connection failures; tests/test_sealfix.py joins the suite.
# v0.23.0: the five-request desktop overhaul — the Test Connection
# modal, the two-radio LLM tab with first-class Anthropic Claude
# support + the split context budget (llm_num_ctx +
# llm_max_output_tokens), themed dialog backgrounds (the wizard
# light-mode fix), the main view's Detect & Set row removed, and
# Input reduced to Import txt file (.txt/.md); tests/test_v0230.py
# joins the suite (772).
# Prior: v0.17.0 Test Connection; v0.16.0 Phase 6 Linking; v0.15.1 the
# automatic llama.cpp catch; v0.14.1 the first Windows zip.
# test_quarantine, test_phase0, test_phase1 and test_phase2 import
# gitcurator/gui/app.py (CacheDB and ProcessingWorker live there), so the
# app requirements are installed first; the suite runs headless on the
# offscreen Qt platform and never launches the GUI.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Python gate (compile + 900 tests + websites pipeline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt system libraries (runner images no longer bundle libEGL, needed by offscreen PyQt6)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install app requirements (the quarantine suite imports the GUI package)
        run: python -m pip install --quiet -r requirements.txt

      - name: Compile the 84 audited modules
        run: >
          python -m py_compile
          main.py
          gitcurator/gui/app.py
          gitcurator/gui/theme.py
          gitcurator/gui/icons.py
          gitcurator/gui/telegram_lock.py
          gitcurator/gui/sound.py
          gitcurator/gui/link_helpers.py
          gitcurator/gui/dead_links.py
          gitcurator/gui/telegram_lazy.py
          gitcurator/gui/platform_intake.py
          gitcurator/gui/vault_index.py
          gitcurator/gui/cache_db.py
          gitcurator/gui/link_tracker.py
          gitcurator/gui/log_bridge.py
          gitcurator/gui/worker_jobs.py
          gitcurator/gui/processing_worker.py
          gitcurator/gui/worker/__init__.py
          gitcurator/gui/worker/llm.py
          gitcurator/gui/worker/github_meta.py
          gitcurator/gui/worker/notes.py
          gitcurator/gui/worker/reports.py
          gitcurator/gui/worker/inputs.py
          gitcurator/gui/worker/website_phase.py
          gitcurator/gui/dialogs.py
          gitcurator/gui/headless.py
          gitcurator/gui/main_window/__init__.py
          gitcurator/gui/main_window/window.py
          gitcurator/gui/main_window/log_view.py
          gitcurator/gui/main_window/theme.py
          gitcurator/gui/main_window/ui.py
          gitcurator/gui/main_window/hero.py
          gitcurator/gui/main_window/connection_tests.py
          gitcurator/gui/main_window/llamacpp.py
          gitcurator/gui/main_window/linking_tools.py
          gitcurator/gui/main_window/test_connection_modal.py
          gitcurator/gui/main_window/vaults_config.py
          gitcurator/gui/main_window/input_proxy.py
          gitcurator/gui/main_window/telegram_ui.py
          gitcurator/gui/main_window/processing_control.py
          gitcurator/gui/main_window/dashboard.py
          gitcurator/gui/main_window/bot_queue.py
          gitcurator/gui/main_window/backup_seal.py
          gitcurator/gui/main_window/lifecycle.py
          gitcurator/core/links.py
          gitcurator/core/storage.py
          gitcurator/core/note_builder.py
          gitcurator/core/llm_client.py
          gitcurator/core/dryrun.py
          gitcurator/core/note_state.py
          gitcurator/core/taxonomy.py
          gitcurator/core/prompts.py
          gitcurator/core/hand_delivery.py
          gitcurator/core/chrome_tabs.py
          gitcurator/core/web_fetch.py
          gitcurator/core/web_extract.py
          gitcurator/core/website_pipeline.py
          gitcurator/core/website_directory.py
          gitcurator/core/website_state.py
          gitcurator/core/mirror.py
          gitcurator/core/recall.py
          gitcurator/core/embeddings.py
          gitcurator/core/linking.py
          gitcurator/core/connection_check.py
          gitcurator/integrations/vaultseal.py
          gitcurator/integrations/goodrepos.py
          gitcurator/integrations/telegram_fetch_worker.py
          gitcurator/integrations/telethon_fetcher.py
          gitcurator/integrations/backfill_manager.py
          gitcurator/integrations/subprocess_runner.py
          gitcurator/cloud/cloudflare_sync.py
          gitcurator/cli.py
          gitcurator/cli_terminal.py
          gitcurator/cli_settings.py
          gitcurator/cli_run.py
          gitcurator/tools/scan_vault_edits.py
          gitcurator/tools/snapshot_vault.py
          gitcurator/tools/pick_golden_links.py
          gitcurator/tools/run_golden_websites.py
          gitcurator/tools/backfill_websites.py
          gitcurator/tools/mirror_manual.py
          gitcurator/tools/build_zip.py
          gitcurator/tools/add_recall_hooks.py
          gitcurator/tools/build_links.py
          gitcurator/core/mirror_keys.py
          gitcurator/core/netctx.py

      - name: Run the test suite (core + e2e + goodrepos + reliability + quarantine + phase0 + phase1 + phase2 + phase3 + phase4 + phase5 + packaging + llamacpp + phase6 + connection + detectset + webproxy + intakefix + sealfix + v0230 + refactor_surface + swotfix + socialomit + resyncfix + reconfix + batchfinish + soundsettings + reviewretry + bothdoors + decommission + thirddoor + ladder + handdelivery + reviewtable + fifthdoor + masterretry)
        run: python -m unittest tests.test_core tests.test_e2e tests.test_goodrepos tests.test_reliability tests.test_quarantine tests.test_phase0 tests.test_phase1 tests.test_phase2 tests.test_phase3 tests.test_phase4 tests.test_phase5 tests.test_packaging tests.test_llamacpp tests.test_phase6 tests.test_connection tests.test_detectset tests.test_webproxy tests.test_intakefix tests.test_sealfix tests.test_v0230 tests.test_refactor_surface tests.test_websitesqueuefix tests.test_swotfix tests.test_webnote_v2 tests.test_lawfix tests.test_importbatch tests.test_socialomit tests.test_resyncfix tests.test_reconfix tests.test_batchfinish tests.test_soundsettings tests.test_reviewretry tests.test_bothdoors tests.test_decommission tests.test_thirddoor tests.test_ladder tests.test_autopip tests.test_mastertable tests.test_handdelivery tests.test_reviewtable tests.test_fifthdoor tests.test_masterretry -v

      - name: Offline golden-set run (websites pipeline, no network)
        run: python gitcurator/tools/run_golden_websites.py --offline

      - name: Cloudflare bot Worker tests (Node built-in runner, no deps)
        working-directory: app/cloudflare-bot
        run: npm test

      - name: Test summary
        if: always()
        run: "echo \"Gate: 85 compiles + 1396 tests + worker 50 + offline golden run (v0.51.0). Mirrors the removed dashboard's POST /api/verify one-to-one.\""

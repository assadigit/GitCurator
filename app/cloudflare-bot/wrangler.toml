name = "github-to-obsidian-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# ========================================
# D1 Database (primary store — Cloudflare-managed, durable)
# ========================================
[[d1_databases]]
binding = "DB"
database_name = "curator-bot"
database_id = "6ddf208d-a85c-4ba9-a4dc-f6be0d781f36"

# ========================================
# KV Namespace (hot cache for dedup)
# ========================================
[[kv_namespaces]]
binding = "CACHE"
id = "4a0ad4111a1c49deaea2dc8851579cdd"

# ========================================
# Queues (7-day retry buffer for ingestion)
# ========================================
[[queues.producers]]
queue = "curator-ingest"
binding = "INGEST_QUEUE"

[[queues.consumers]]
queue = "curator-ingest"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "curator-ingest-dlq"

[[queues.producers]]
queue = "curator-ingest-dlq"
binding = "DLQ"

# ========================================
# Cron Triggers (OPTIONAL — enable via Dashboard if needed)
# ========================================
# Uncomment to enable cron triggers:
# [triggers]
# crons = [
#   "0 * * * *",       # Every hour — health check
#   "30 5 * * 0",      # Sunday 05:30 UTC — weekly report
#   "30 20 * * *"      # 20:30 UTC — daily summary
# ]

# ========================================
# Secrets (already set — do NOT put in this file)
# ========================================
# BOT_TOKEN, GITHUB_PAT, ALLOWED_USER_IDS, HMAC_SECRET
# These are set via: npx wrangler secret put <NAME>
# or via the auto-installer: node install.js
#
# v30 — OPTIONAL webhook hardening (recommended):
#   npx wrangler secret put WEBHOOK_SECRET        # any A-Za-z0-9_- string, 1-256 chars
#   then re-register the webhook ONCE with the same secret:
#   curl "https://api.telegram.org/bot$BOT_TOKEN/setWebhook?url=https://<worker>/webhook&secret_token=$WEBHOOK_SECRET"
# index.js then rejects any POST /webhook without a matching
# X-Telegram-Bot-Api-Secret-Token header (stops forged updates).
